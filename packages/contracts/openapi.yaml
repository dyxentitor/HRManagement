  schemas:
    AccrualTypeEnum:
      enum:
      - annual
      - monthly
      - event_based
      - none
      type: string
      description: |-
        * `annual` - Annual
        * `monthly` - Monthly
        * `event_based` - Event-based
        * `none` - No accrual
    AttendanceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        org_id:
          type: string
          format: uuid
          readOnly: true
        employee:
          type: string
          format: uuid
        employee_code:
          type: string
          readOnly: true
        work_date:
          type: string
          format: date
        clock_in:
          type: string
          format: date-time
          nullable: true
        clock_out:
          type: string
          format: date-time
          nullable: true
        computed_hours:
          type: number
          format: double
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        is_holiday_work:
          type: boolean
          readOnly: true
        holiday_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        shift_assignment_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceRecordStatusEnum'
          readOnly: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 512
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
