      - active
      - suspended
      - archived
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `archived` - Archived
    WorkSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        pattern: {}
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
      required:
      - effective_from
      - employee
      - id
    WorkScheduleRequest:
      type: object
      properties:
        employee:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        pattern: {}
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
      required:
      - effective_from
      - employee
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
