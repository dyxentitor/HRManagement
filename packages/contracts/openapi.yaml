openapi: 3.0.3
info:
  title: HRMS API
  version: 0.1.0
  description: HR Management System — Phase 1
paths:
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/mfa:
    post:
      operationId: auth_login_mfa_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/mfa:
    delete:
      operationId: auth_mfa_destroy
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/confirm:
    post:
      operationId: auth_mfa_confirm_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/mfa/enable:
    post:
      operationId: auth_mfa_enable_create
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/password/forgot:
    post:
      operationId: auth_password_forgot_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/departments/:
    get:
      operationId: departments_list
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          description: ''
    post:
      operationId: departments_create
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: departments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    put:
      operationId: departments_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    patch:
      operationId: departments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    delete:
      operationId: departments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/:
    get:
      operationId: employees_list
      description: HR-facing employee CRUD.
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
          description: ''
    post:
      operationId: employees_create
      description: HR-facing employee CRUD.
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: employees_retrieve
      description: HR-facing employee CRUD.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    put:
      operationId: employees_update
      description: HR-facing employee CRUD.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    patch:
      operationId: employees_partial_update
      description: HR-facing employee CRUD.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    delete:
      operationId: employees_destroy
      description: HR-facing employee CRUD.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/{id}/direct-reports/:
    get:
      operationId: employees_direct_reports_retrieve
      description: HR-facing employee CRUD.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{id}/probation-status/:
    get:
      operationId: employees_probation_status_retrieve
      description: HR-facing employee CRUD.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{id}/reporting-chain/:
    get:
      operationId: employees_reporting_chain_retrieve
      description: HR-facing employee CRUD.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/me/:
    get:
      operationId: employees_me_retrieve
      description: HR-facing employee CRUD.
      tags:
      - employees
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    patch:
      operationId: employees_me_partial_update
      description: HR-facing employee CRUD.
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/org/settings:
    get:
      operationId: org_settings_retrieve
      description: GET/PATCH the current user's organization settings.
      tags:
      - org
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
          description: ''
    patch:
      operationId: org_settings_partial_update
      description: GET/PATCH the current user's organization settings.
      tags:
      - org
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrgSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrgSettingsRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSettings'
          description: ''
  /api/v1/organizations/:
    get:
      operationId: organizations_list
      description: 'Phase 1: read-only org view at /api/v1/organizations/.'
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/organizations/{slug}/:
    get:
      operationId: organizations_retrieve
      description: 'Phase 1: read-only org view at /api/v1/organizations/.'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - organizations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /health:
    get:
      operationId: health_retrieve
      description: Liveness check — process is up.
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /health/ready:
    get:
      operationId: health_ready_retrieve
      description: Readiness check — dependencies (DB) reachable.
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        parent:
          type: string
          format: uuid
          nullable: true
        head_employee_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parent:
          type: string
          format: uuid
          nullable: true
        head_employee_id:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    Employee:
      type: object
      description: Full HR view — all fields readable; encrypted fields write-through.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        org_id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
        employee_code:
          type: string
          maxLength: 32
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        preferred_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        alt_phone:
          type: string
          maxLength: 32
        ic_last4:
          type: string
          readOnly: true
        date_of_birth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
        nationality:
          type: string
          maxLength: 2
        marital_status:
          $ref: '#/components/schemas/MaritalStatusEnum'
        religion:
          type: string
          maxLength: 32
        address_line1:
          type: string
          maxLength: 200
        address_line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postcode:
          type: string
          maxLength: 20
        country_code:
          type: string
          maxLength: 2
        department:
          type: string
          format: uuid
        manager:
          type: string
          format: uuid
          nullable: true
        role_title:
          type: string
          maxLength: 100
        employment_type:
          $ref: '#/components/schemas/EmploymentTypeEnum'
        schedule_type:
          $ref: '#/components/schemas/ScheduleTypeEnum'
        hire_date:
          type: string
          format: date
        probation_end_date:
          type: string
          format: date
          nullable: true
        contract_end_date:
          type: string
          format: date
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        bank_name:
          type: string
          maxLength: 100
        bank_account_last4:
          type: string
          readOnly: true
        emergency_contact_name:
          type: string
          maxLength: 100
        emergency_contact_relationship:
          type: string
          maxLength: 50
        emergency_contact_phone:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/EmployeeStatusEnum'
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 10
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line1
      - bank_account_last4
      - bank_name
      - city
      - country_code
      - created_at
      - date_of_birth
      - department
      - email
      - emergency_contact_name
      - emergency_contact_phone
      - emergency_contact_relationship
      - employee_code
      - employment_type
      - first_name
      - full_name
      - gender
      - hire_date
      - ic_last4
      - id
      - last_name
      - marital_status
      - nationality
      - org_id
      - phone
      - postcode
      - role_title
      - state
      - updated_at
    EmployeeRequest:
      type: object
      description: Full HR view — all fields readable; encrypted fields write-through.
      properties:
        user:
          type: string
          format: uuid
          nullable: true
        employee_code:
          type: string
          minLength: 1
          maxLength: 32
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        preferred_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          minLength: 1
          maxLength: 32
        alt_phone:
          type: string
          maxLength: 32
        ic_number:
          type: string
          format: byte
          writeOnly: true
          nullable: true
        date_of_birth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
        nationality:
          type: string
          minLength: 1
          maxLength: 2
        marital_status:
          $ref: '#/components/schemas/MaritalStatusEnum'
        religion:
          type: string
          maxLength: 32
        address_line1:
          type: string
          minLength: 1
          maxLength: 200
        address_line2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        postcode:
          type: string
          minLength: 1
          maxLength: 20
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        department:
          type: string
          format: uuid
        manager:
          type: string
          format: uuid
          nullable: true
        role_title:
          type: string
          minLength: 1
          maxLength: 100
        employment_type:
          $ref: '#/components/schemas/EmploymentTypeEnum'
        schedule_type:
          $ref: '#/components/schemas/ScheduleTypeEnum'
        hire_date:
          type: string
          format: date
        probation_end_date:
          type: string
          format: date
          nullable: true
        contract_end_date:
          type: string
          format: date
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        bank_name:
          type: string
          minLength: 1
          maxLength: 100
        bank_account_number:
          type: string
          format: byte
          writeOnly: true
          nullable: true
        lhdn_tax_no:
          type: string
          format: byte
          writeOnly: true
          nullable: true
        epf_no:
          type: string
          format: byte
          writeOnly: true
          nullable: true
        socso_no:
          type: string
          format: byte
          writeOnly: true
          nullable: true
        eis_no:
          type: string
          format: byte
          writeOnly: true
          nullable: true
        emergency_contact_name:
          type: string
          minLength: 1
          maxLength: 100
        emergency_contact_relationship:
          type: string
          minLength: 1
          maxLength: 50
        emergency_contact_phone:
          type: string
          minLength: 1
          maxLength: 32
        status:
          $ref: '#/components/schemas/EmployeeStatusEnum'
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 10
      required:
      - address_line1
      - bank_name
      - city
      - country_code
      - date_of_birth
      - department
      - email
      - emergency_contact_name
      - emergency_contact_phone
      - emergency_contact_relationship
      - employee_code
      - employment_type
      - first_name
      - gender
      - hire_date
      - last_name
      - marital_status
      - nationality
      - phone
      - postcode
      - role_title
      - state
    EmployeeStatusEnum:
      enum:
      - active
      - probation
      - on_leave
      - terminated
      - resigned
      type: string
      description: |-
        * `active` - Active
        * `probation` - Probation
        * `on_leave` - On leave
        * `terminated` - Terminated
        * `resigned` - Resigned
    EmploymentTypeEnum:
      enum:
      - fulltime
      - parttime
      - contract
      - intern
      type: string
      description: |-
        * `fulltime` - Full-time
        * `parttime` - Part-time
        * `contract` - Contract
        * `intern` - Intern
    GenderEnum:
      enum:
      - male
      - female
      - other
      - undisclosed
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
        * `undisclosed` - Undisclosed
    MaritalStatusEnum:
      enum:
      - single
      - married
      - divorced
      - widowed
      type: string
      description: |-
        * `single` - Single
        * `married` - Married
        * `divorced` - Divorced
        * `widowed` - Widowed
    OrgSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        country_code:
          type: string
          maxLength: 2
        default_currency:
          type: string
          maxLength: 3
        default_timezone:
          type: string
          maxLength: 64
        default_locale:
          type: string
          maxLength: 10
        settings: {}
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEe8Enum'
          readOnly: true
      required:
      - country_code
      - default_currency
      - default_locale
      - default_timezone
      - id
      - name
      - slug
      - status
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        country_code:
          type: string
          maxLength: 2
        default_currency:
          type: string
          maxLength: 3
        default_timezone:
          type: string
          maxLength: 64
        default_locale:
          type: string
          maxLength: 10
        settings: {}
        status:
          $ref: '#/components/schemas/StatusEe8Enum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country_code
      - created_at
      - default_currency
      - default_locale
      - default_timezone
      - id
      - name
      - slug
      - updated_at
    PatchedDepartmentRequest:
