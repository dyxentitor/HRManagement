components:
  schemas:
    AccrualTypeEnum:
      enum:
      - annual
      - monthly
      - event_based
      - none
      type: string
      description: |-
        * `annual` - Annual
        * `monthly` - Monthly
        * `event_based` - Event-based
        * `none` - No accrual
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        body:
          type: string
        category:
          $ref: '#/components/schemas/CategoryE26Enum'
        priority:
          $ref: '#/components/schemas/PriorityE72Enum'
        status:
          allOf:
          - $ref: '#/components/schemas/AnnouncementStatusEnum'
          readOnly: true
        pinned:
          type: boolean
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        audience_type:
          $ref: '#/components/schemas/AudienceTypeEnum'
        audience_spec: {}
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        attachments:
          type: array
          items: {}
          readOnly: true
      required:
      - attachments
      - body
      - created_at
      - created_by
      - id
      - is_read
      - published_at
      - status
      - title
    AnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/CategoryE26Enum'
        priority:
          $ref: '#/components/schemas/PriorityE72Enum'
        pinned:
          type: boolean
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        audience_type:
          $ref: '#/components/schemas/AudienceTypeEnum'
        audience_spec: {}
      required:
      - body
      - title
    AnnouncementStatusEnum:
      enum:
      - draft
      - scheduled
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `scheduled` - Scheduled
        * `published` - Published
        * `archived` - Archived
    AnnouncementWrite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        body:
          type: string
        category:
          $ref: '#/components/schemas/CategoryE26Enum'
        priority:
          $ref: '#/components/schemas/PriorityE72Enum'
        pinned:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        audience_type:
          $ref: '#/components/schemas/AudienceTypeEnum'
        audience_spec: {}
      required:
      - body
      - id
      - title
    AnnouncementWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/CategoryE26Enum'
        priority:
          $ref: '#/components/schemas/PriorityE72Enum'
        pinned:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        scheduled_at:
