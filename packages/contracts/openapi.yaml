        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        type:
          $ref: '#/components/schemas/AssignmentTypeEnum'
        link_url:
          type: string
          maxLength: 1000
        link_target:
          $ref: '#/components/schemas/LinkTargetEnum'
        default_due_date:
          type: string
          format: date
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentStatusEnum'
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        complete_on:
          type: string
          maxLength: 32
        requires_evidence:
