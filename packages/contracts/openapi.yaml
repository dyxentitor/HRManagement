components:
  schemas:
    AccrualTypeEnum:
      enum:
      - annual
      - monthly
      - event_based
      - none
      type: string
      description: |-
        * `annual` - Annual
        * `monthly` - Monthly
        * `event_based` - Event-based
        * `none` - No accrual
    AttendanceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        org_id:
          type: string
          format: uuid
          readOnly: true
        employee:
          type: string
          format: uuid
        employee_code:
          type: string
          readOnly: true
        work_date:
          type: string
          format: date
        clock_in:
          type: string
          format: date-time
          nullable: true
        clock_out:
          type: string
          format: date-time
          nullable: true
        computed_hours:
          type: number
          format: double
          readOnly: true
        source:
          $ref: '#/components/schemas/AttendanceRecordSourceEnum'
        is_holiday_work:
          type: boolean
          readOnly: true
        holiday_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        shift_assignment_id:
          type: string
          format: uuid
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceRecordStatusEnum'
          readOnly: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 512
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - computed_hours
      - created_at
      - employee
      - employee_code
      - holiday_id
      - id
      - is_holiday_work
      - org_id
      - status
      - updated_at
      - work_date
    AttendanceRecordRequest:
      type: object
      properties:
        employee:
          type: string
          format: uuid
        work_date:
          type: string
          format: date
        clock_in:
          type: string
          format: date-time
          nullable: true
        clock_out:
          type: string
          format: date-time
          nullable: true
        source:
          $ref: '#/components/schemas/AttendanceRecordSourceEnum'
        shift_assignment_id:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
          nullable: true
          minLength: 1
        user_agent:
          type: string
          maxLength: 512
        notes:
          type: string
      required:
      - employee
      - work_date
    AttendanceRecordSourceEnum:
      enum:
      - web
      - kiosk
      - mobile
      - admin
      type: string
      description: |-
        * `web` - Web
        * `kiosk` - Kiosk
        * `mobile` - Mobile
        * `admin` - Admin
    AttendanceRecordStatusEnum:
      enum:
      - present
      - late
      - absent
      - holiday
      - on_leave
      - partial
      type: string
      description: |-
        * `present` - Present
        * `late` - Late
        * `absent` - Absent
        * `holiday` - Holiday
        * `on_leave` - On leave
        * `partial` - Partial
    BlankEnum:
      enum:
      - ''
    ClaimApproval:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        level:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        approver_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/Status872Enum'
        comment:
          type: string
        acted_at:
          type: string
          format: date-time
          nullable: true
        delegated_to:
          type: string
          format: uuid
          nullable: true
      required:
      - approver_id
      - id
      - level
    ClaimApprovalRequest:
      type: object
      properties:
        level:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        approver_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/Status872Enum'
        comment:
          type: string
        acted_at:
          type: string
          format: date-time
          nullable: true
        delegated_to:
          type: string
          format: uuid
          nullable: true
      required:
      - approver_id
      - level
    ClaimAttachment:
      type: object
      properties:
