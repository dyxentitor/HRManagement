openapi: 3.0.3
info:
  title: HRMS API
  version: 0.1.0
  description: HR Management System — Phase 1
paths:
  /api/v1/departments/:
    get:
      operationId: departments_list
      tags:
      - departments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          description: ''
    post:
      operationId: departments_create
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: departments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    put:
      operationId: departments_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    patch:
      operationId: departments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    delete:
      operationId: departments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - departments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/organizations/:
    get:
      operationId: organizations_list
      description: |-
        Phase 1: read-only org view at /api/v1/organizations/. Org admin endpoint
        for creating new orgs lands in M1b together with auth.
      tags:
      - organizations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/organizations/{slug}/:
    get:
      operationId: organizations_retrieve
      description: |-
        Phase 1: read-only org view at /api/v1/organizations/. Org admin endpoint
        for creating new orgs lands in M1b together with auth.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /health:
    get:
      operationId: health_retrieve
      description: Liveness check — process is up.
      tags:
      - health
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /health/ready:
    get:
      operationId: health_ready_retrieve
      description: Readiness check — dependencies (DB) reachable.
      tags:
      - health
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        parent:
          type: string
          format: uuid
          nullable: true
        head_employee_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parent:
          type: string
          format: uuid
          nullable: true
        head_employee_id:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        country_code:
          type: string
          maxLength: 2
        default_currency:
          type: string
          maxLength: 3
        default_timezone:
          type: string
          maxLength: 64
        default_locale:
          type: string
          maxLength: 10
        settings: {}
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country_code
      - created_at
      - default_currency
      - default_locale
      - default_timezone
      - id
      - name
      - slug
      - updated_at
    PatchedDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parent:
          type: string
          format: uuid
          nullable: true
        head_employee_id:
          type: string
          format: uuid
          nullable: true
    StatusEnum:
      enum:
      - active
      - suspended
      - archived
      type: string
      description: |-
        * `active` - Active
        * `suspended` - Suspended
        * `archived` - Archived
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
