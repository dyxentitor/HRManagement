          format: date
          nullable: true
        is_template:
          type: boolean
          readOnly: true
        next_run_at:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - is_template
      - next_run_at
      - status
      - title
      - version
    AssignmentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        type:
          $ref: '#/components/schemas/AssignmentTypeEnum'
        link_url:
          type: string
          maxLength: 1000
        link_target:
          $ref: '#/components/schemas/LinkTargetEnum'
        default_due_date:
          type: string
          format: date
          nullable: true
        complete_on:
