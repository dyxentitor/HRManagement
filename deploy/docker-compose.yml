name: hrms-dev

x-api-env: &api-env
  DJANGO_SETTINGS_MODULE: hrms_api.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-replace-me}
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: "*"
  DATABASE_URL: postgres://hrms:hrms@postgres:5432/hrms
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT_URL: http://minio:9000
  # S3_PUBLIC_ENDPOINT_URL is the host the browser uses to follow presigned
  # URLs. In dev that's the host's localhost (MinIO is published on :9000).
  # In prod, leave unset so the public client falls back to S3_ENDPOINT_URL.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_ACCESS_KEY: hrms
  S3_SECRET_KEY: hrms-dev-secret
  S3_BUCKET: hrms
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  EMAIL_DIGEST_INTERVAL_SECONDS: ${EMAIL_DIGEST_INTERVAL_SECONDS:-60}
  # No fallback — this MUST come from the environment / .env. Compose will fail
  # to start if HRMS_FIELD_ENCRYPTION_KEY is unset, which is the right behaviour:
  # silently encrypting under the wrong key = unrecoverable data. See
  # docs/runbooks/rotate-encryption-keys.md for rotation; .env.example for
  # generation instructions.
  HRMS_FIELD_ENCRYPTION_KEY: ${HRMS_FIELD_ENCRYPTION_KEY:?HRMS_FIELD_ENCRYPTION_KEY must be set in .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hrms
      MINIO_ROOT_PASSWORD: hrms-dev-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment: *api-env
    volumes:
      - ../apps/api:/app
      - /app/.venv
      - /app/staticfiles
    command: uv run python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailhog: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment: *api-env
    volumes:
      - ../apps/api:/app
      - /app/.venv
      - /app/staticfiles
    command: uv run celery -A hrms_api worker -l info
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment: *api-env
    volumes:
      - ../apps/api:/app
      - /app/.venv
      - /app/staticfiles
    command: uv run celery -A hrms_api beat -l info -S django
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:20-alpine
    working_dir: /repo/apps/web
    volumes:
      - ..:/repo                           # entire repo
      - /repo/apps/web/node_modules         # named volume — keep node_modules in-container
      - /repo/node_modules
    command: >
      sh -c "corepack enable && corepack prepare pnpm@9 --activate &&
             cd /repo && pnpm install --filter @hrms/web... &&
             cd /repo/apps/web && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]

volumes:
  postgres-data:
  minio-data:
