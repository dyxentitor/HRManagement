global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: production
    app: hrms

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: hrms-api
    static_configs:
      - targets:
          - api:8000
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  # Celery queue metrics require a `flower` service (celery -A hrms_api flower).
  # Deferred — add the flower service + this scrape job when celery metrics are needed:
  #   - job_name: celery
  #     static_configs: [{ targets: ["flower:5555"] }]
  #     metrics_path: /metrics

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
