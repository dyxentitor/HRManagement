# Production overlay — use with the base file:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Requires Docker Compose >= 2.24 (for the !reset / !override merge tags).
# TLS certs must be present at deploy/nginx/pki/server/{fullchain.pem,privkey.pem}.
name: hrms-prod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: !reset [] # internal-only in prod (never publish the DB to the host)
    <<: *logging

  redis:
    restart: unless-stopped
    ports: !reset []
    <<: *logging

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: hrms_api.settings.prod
      DJANGO_DEBUG: "0"
      DATABASE_URL: ${DATABASE_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      SENTRY_DSN: ${SENTRY_DSN}
      EMAIL_DIGEST_INTERVAL_SECONDS: ${EMAIL_DIGEST_INTERVAL_SECONDS}
    volumes: !reset [] # run the built image, not the mounted dev source
    ports: !reset [] # only nginx reaches the API
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run gunicorn hrms_api.wsgi:application --bind 0.0.0.0:8000
             --workers 4 --timeout 120 --graceful-timeout 30
             --max-requests 1000 --max-requests-jitter 100"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    <<: *logging

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: hrms_api.settings.prod
      DJANGO_DEBUG: "0"
      DATABASE_URL: ${DATABASE_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      SENTRY_DSN: ${SENTRY_DSN}
      EMAIL_DIGEST_INTERVAL_SECONDS: ${EMAIL_DIGEST_INTERVAL_SECONDS}
    volumes: !reset []
    command: uv run celery -A hrms_api worker -l warning --concurrency 4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A hrms_api inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 1g
    cpus: 2.0
    <<: *logging

  beat:
    environment:
      DJANGO_SETTINGS_MODULE: hrms_api.settings.prod
      DJANGO_DEBUG: "0"
      DATABASE_URL: ${DATABASE_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      SENTRY_DSN: ${SENTRY_DSN}
      EMAIL_DIGEST_INTERVAL_SECONDS: ${EMAIL_DIGEST_INTERVAL_SECONDS}
    volumes: !reset []
    command: uv run celery -A hrms_api beat -l warning -S django
    restart: unless-stopped
    mem_limit: 512m
    <<: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    command: ["nginx", "-g", "daemon off;"]
    working_dir: /
    environment: !reset {}
    volumes: !override
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/pki/server/server-fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./nginx/pki/server/server-key.pem:/etc/nginx/certs/privkey.pem:ro
    ports: !override
      - "80:80"
      - "443:443"
      - "9443:9443"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    <<: *logging

  # Dev-only services never start in prod.
  mailhog:
    profiles: ["dev-only"]

  minio:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: !reset []            # internal-only; browsers reach it via nginx :9443 (Task A4)
    <<: *logging
