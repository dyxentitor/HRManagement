# Production edge — TLS termination, security headers, SPA + API reverse proxy.
#
# Certs must be mounted at /etc/nginx/certs/{fullchain.pem,privkey.pem}
# (Let's Encrypt or corporate CA). Replace `server_name _;` with your domain.
# This file is mounted into the web (nginx) container by docker-compose.prod.yml.

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml font/woff2;

# Per-IP throttle bucket for auth endpoints (defence-in-depth with DRF throttling).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# --- HTTP :80 — redirect everything to HTTPS (ACME challenge passes through) ---
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # Container healthcheck probes http://localhost/healthz on :80 — answer it
    # directly so the probe isn't 301'd into TLS (BusyBox wget can't follow the
    # internal-CA https redirect). Does not affect real traffic (all else 301s).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Sized for profile photos, claim receipts, and payroll CSV imports.
    client_max_body_size 25m;

    # Security headers on the nginx-served SPA (the API sets its own too).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Container liveness (nginx only, doesn't touch the API).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed filenames — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the app shell so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Tighter rate limit on auth endpoints (matched before the generic /api/ block).
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API reverse proxy.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Long enough for CSV/XLSX/PDF report + payroll runs.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        access_log off;
        proxy_pass http://api:8000/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# MinIO S3 API over TLS — dedicated port, NO path prefix so presigned
# signatures (computed against https://host:9443) match what MinIO receives.
server {
    listen 9443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    client_max_body_size 100m;   # large attachments / photos
    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 300s;
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
}
