[project]
name = "hrms-api"
version = "1.12.1"
description = "HRMS Phase 1 backend (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0,<5.1",
  "djangorestframework>=3.15,<3.16",
  "djangorestframework-simplejwt>=5.3,<6.0",
  "drf-spectacular>=0.27,<0.28",
  "django-cors-headers>=4.3,<5.0",
  "django-environ>=0.11,<0.12",
  "psycopg[binary]>=3.1,<4.0",
  "redis>=5.0,<6.0",
  "celery>=5.3,<6.0",
  "django-celery-beat>=2.6,<3.0",
  "boto3>=1.34,<2.0",
  "cryptography>=42.0,<44.0",
  "argon2-cffi>=23.1,<24.0",
  "pyotp>=2.9,<3.0",
  "qrcode[pil]>=8.0,<9.0",
  "structlog>=24.1,<25.0",
  "gunicorn>=22.0,<23.0",
  "uvicorn[standard]>=0.30,<0.31",
  "whitenoise>=6.6,<7.0",
  "reportlab>=4.0,<5.0",
  "openpyxl>=3.1,<4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-django>=4.8,<5.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-xdist>=3.6,<4.0",
  "factory-boy>=3.3,<4.0",
  "freezegun>=1.5,<2.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "django-stubs[compatible-mypy]>=5.0,<6.0",
  "djangorestframework-stubs[compatible-mypy]>=3.15,<4.0",
  "bandit>=1.7,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "DJ", "RUF"]
ignore = ["S101"]  # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N", "B"]
# Progressive employee profiles: non-essential string fields are intentionally
# nullable so DRF's ModelSerializer relaxes `required`. NULL means "not yet
# provided" (distinct from an empty string), which is the desired semantics.
"modules/employee/models.py" = ["DJ001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "hrms_api.settings.test"
