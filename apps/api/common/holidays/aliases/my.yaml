# Canonical holiday identity aliases for Malaysia (ISO 3166-1: MY).
#
# WHY THIS FILE EXISTS
#   A display name is NOT an identity. The same holiday is called
#   "Prophet Muhammad's Birthday" by python-holidays, "Maulidur Rasul" by the
#   Cabinet gazette, and "Hari Keputeraan Nabi Muhammad S.A.W." in Malay.
#   Without this mapping each spelling would mint its own `source_key`, so an
#   official override would sit *beside* the provider row instead of
#   outranking it, and precedence would silently never fire.
#
# FORMAT
#   <canonical-code>:
#     - <alias slug>
#     - <alias slug>
#   Slugs are the output of `slugify_holiday_name()` (lowercased, accents
#   folded, apostrophes removed, punctuation collapsed to "-").
#
# RULES
#   * A slug may appear under exactly ONE canonical code. A duplicate is a
#     hard error at load time — silently merging two distinct holidays is far
#     worse than failing loudly.
#   * Multi-day festivals get DISTINCT canonical codes (…-day-2, …-day-3),
#     never an alias of day 1. Merging them would collapse two real days off.
#   * An unknown name falls back to its own slug, so a newly-added holiday is
#     never mis-merged into an existing one.

chinese-new-year:
  - chinese-new-year
  - tahun-baharu-cina
  - cny

chinese-new-year-day-2:
  - chinese-new-year-second-day
  - chinese-new-year-2nd-day
  - tahun-baharu-cina-hari-kedua
  - chinese-new-year-day-two

