<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRMS Notification</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f7; font-family: Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 32px auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
    .header { background: {{ accent }}; padding: 24px 32px; }
    .header h1 { margin: 0; color: #ffffff; font-size: 20px; }
    .body { padding: 32px; color: #333333; line-height: 1.6; }
    .footer { padding: 16px 32px; background: #f4f4f7; font-size: 12px; color: #888888; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header"><h1>HRMS</h1>{{ header_html|safe }}</div>
    <div class="body">
      {% block body %}{% endblock %}
      {{ footer_html|safe }}
    </div>
    <div class="footer">This is an automated message from HRMS. Please do not reply.</div>
  </div>
</body>
</html>
