# Verified official Malaysian public holidays (Hari Kelepasan Am).
#
# PRECEDENCE: rows here load with source="official", which outranks imported
# provider data and the legacy fixture. Only an org-level override beats it.
#
# PROVENANCE — transcribed from the Cabinet Division (Bahagian Kabinet,
# Perlembagaan dan Perhubungan Antara Kerajaan, Jabatan Perdana Menteri) PDFs
# linked from https://www.kabinet.gov.my/hari-kelepasan-am/ :
#   2026 — "JADUAL HARI KELEPASAN AM PERSEKUTUAN 2026" (HKA-2026.pdf)
#   2027 — "JADUAL HARI KELEPASAN AM PERSEKUTUAN 2027" (HKA_2027.pdf)
# Cross-checked against https://jtksm.mohr.gov.my/en/kalendar and, as a
# secondary comparison only, https://publicholidays.com.my/.
# Retrieved 2026-08-25.
#
# SCOPE DISCIPLINE
#   * Only holidays the federal schedule marks for ALL 16 states/territories
#     are entered as nationwide (no `subdivision_code`).
#   * Holidays the schedule grants to a SUBSET are entered as one row per
#     state, using full ISO 3166-2 codes. They are deliberately NOT flattened
#     into nationwide rows.
#   * `New Year's Day` (1 Jan) and `Federal Territory Day` (1 Feb) are NOT in
#     the federal schedule at all — they are state/FT holidays and are handled
#     as such. The legacy fixture wrongly marked both `federal`.
#
# PROVISIONAL
#   `provisional: true` mirrors the gazette's own "* Tertakluk kepada
#   perubahan" (subject to change) marker. Those dates are official but not
#   yet settled, so they are held back from employee-facing calendars until an
#   administrator confirms them.
#
#   The marker is FORWARD-LOOKING, so it is applied to 2027 only. Every 2026
#   date below has already been observed (retrieved 2026-08-25) and is
#   corroborated by the JTKSM calendar and publicholidays.com.my, so a 2026
#   date can no longer "change" and is recorded as confirmed. Marking settled
#   history provisional would hold correct dates back from employees and leave
#   the wrong legacy date in place — the exact bug this work exists to fix.
#
# ISO 3166-2:MY reference — MY-01 Johor, MY-02 Kedah, MY-03 Kelantan,
# MY-04 Melaka, MY-05 Negeri Sembilan, MY-06 Pahang, MY-07 Pulau Pinang,
# MY-08 Perak, MY-09 Perlis, MY-10 Selangor, MY-11 Terengganu, MY-12 Sabah,
# MY-13 Sarawak, MY-14 W.P. Kuala Lumpur, MY-15 W.P. Labuan,
# MY-16 W.P. Putrajaya.

_reference: &kabinet https://www.kabinet.gov.my/hari-kelepasan-am/

