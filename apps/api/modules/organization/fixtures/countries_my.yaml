- model: organization.country
  pk: MY
  fields:
    name: Malaysia
    default_currency: MYR
    default_timezone: Asia/Kuala_Lumpur

- model: organization.countryleavetypedefault
  fields:
    country_code: MY
    code: ANNUAL
    name: Annual Leave
    default_days: 8
    statutory: true
    accrual_type: annual
    tenure_brackets:
      - {min_years: 0, days: 8}
      - {min_years: 2, days: 12}
      - {min_years: 5, days: 16}
- model: organization.countryleavetypedefault
  fields:
    country_code: MY
    code: MEDICAL
    name: Sick Leave
    default_days: 14
    statutory: true
    accrual_type: annual
    tenure_brackets:
      - {min_years: 0, days: 14}
      - {min_years: 2, days: 18}
      - {min_years: 5, days: 22}
# Post-2022 §60F amendment: hospitalization is now SEPARATE from outpatient sick.
- model: organization.countryleavetypedefault
  fields:
    country_code: MY
    code: HOSPITALIZATION
    name: Hospitalization Leave
    default_days: 60
    statutory: true
    accrual_type: annual
    tenure_brackets: []
- model: organization.countryleavetypedefault
  fields: { country_code: MY, code: MATERNITY,     name: Maternity Leave,     default_days: 98, statutory: true,  accrual_type: event_based }
- model: organization.countryleavetypedefault
  fields: { country_code: MY, code: PATERNITY,     name: Paternity Leave,     default_days: 7,  statutory: true,  accrual_type: event_based }
- model: organization.countryleavetypedefault
  fields: { country_code: MY, code: COMPASSIONATE, name: Compassionate Leave, default_days: 3,  statutory: false, accrual_type: event_based }
- model: organization.countryleavetypedefault
  fields: { country_code: MY, code: UNPAID,        name: Unpaid Leave,        default_days: 0,  statutory: false, accrual_type: none }
- model: organization.countryleavetypedefault
  fields: { country_code: MY, code: REPLACEMENT,   name: Replacement Leave,   default_days: 0,  statutory: false, accrual_type: event_based }

