# System roles seeded for every org. Permission code lists are M1b-scoped only;
# later milestones add to these as their modules ship.

- code: org_admin
  name: Organization Admin
  description: Full org configuration; user/role management
  is_system: true
  permissions:
    - auth:mfa:manage:self
    - user:invite
    - user:edit
    - user:disable
    - user:delete
    - user:read:self
    - user:read:team
    - user:read:org
    - role:read
    - role:write
    - permission:read
    - department:read
    - department:write
    - org:settings:read
    - org:settings:write
    - audit:read:org
    - audit:payroll-ledger:read:org
    - audit:payroll-ledger:verify:org
    - employee:read:self
    - employee:read:team
    - employee:read:org
    - employee:write:self
    - employee:write:org
    - employee:create
    - employee:archive
    - "employee:bank:read"
    - "employee:bank:write"
    - employee:salary:read
    - employee:salary:write
    - "leave:request:create:self"
    - "leave:request:read:self"
    - "leave:request:read:team"
    - "leave:request:read:org"
    - "leave:request:approve:team"
    - "leave:request:cancel:self"
    - "leave:request:cancel:org"
    - "leave:balance:read:self"
    - "leave:balance:read:team"
    - "leave:balance:read:org"
    - "leave:balance:adjust:org"
    - "leave:type:write"
    - "leave:policy:write"
    - "leave:delegation:write:self"

